
<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Configuration -->
    <title>EXAMiO | ডিজিটাল পরীক্ষার পূর্ণাঙ্গ সমাধান</title>
    <meta name="description" content="A comprehensive digital exam management platform for educational institutions.">
    <meta name="theme-color" content="#0071E3">
    
    <!-- Cache Control (Prevent stale index.html) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- iOS Specific PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EXAMiO">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dejm7pz1d/image/upload/v1770135336/IMG_2585_tiorhy.png">
    
    <!-- Manifest Link -->
    <link rel="manifest" href="/manifest.json">

    <!-- OpenCV for OMR -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" type="text/javascript"></script>

    <!-- CRITICAL: Theme Check Script (Prevents White Flash) -->
    <script>
      (function() {
        try {
          const localTheme = localStorage.getItem('theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          
          if (localTheme === 'dark' || (!localTheme && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- CRITICAL CSS: Applied immediately before Tailwind loads -->
    <style>
      html.dark body {
        background-color: #000000 !important;
        color: #F5F5F7;
      }
      /* Prevent text selection to feel more like an app */
      .app-like {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- KaTeX CSS for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0071E3", /* Apple's Royal Blue */
              "primary-dark": "#005bb5",
              "background-light": "#FFFCF5", /* Warm Ivory */
              "background-dark": "#000000", /* Deep Black */
              "surface-light": "#FFFFFF",
              "surface-dark": "#1C1C1E", /* Card Dark */
              "text-main": "#1D1D1F",
              "text-muted": "#86868B",
            },
            fontFamily: {
              "sans": ["Inter", "Noto Sans Bengali", "sans-serif"],
              "display": ["Inter", "Noto Sans Bengali", "sans-serif"]
            },
            boxShadow: {
              'premium': '0 4px 24px rgba(0, 0, 0, 0.04)',
              'premium-hover': '0 8px 32px rgba(0, 0, 0, 0.08)',
              'card': '0 2px 8px rgba(0, 0, 0, 0.02)',
            },
            backgroundImage: {
              'gradient-mesh': 'radial-gradient(at 0% 0%, hsla(210,100%,56%,0.1) 0px, transparent 50%), radial-gradient(at 100% 0%, hsla(280,100%,60%,0.05) 0px, transparent 50%)',
            }
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: var(--tw-colors-background-light);
        text-rendering: auto; /* Reverted to auto for performance */
      }
      
      /* Extremely Optimized Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.1);
        border-radius: 20px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .dark ::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.1);
      }

      /* Custom Animation for Extracted Questions */
      @keyframes fadeInSlideUp {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .animate-fade-in-up {
        animation: fadeInSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>

</head>
  <body class="bg-background-light dark:bg-background-dark text-text-main dark:text-[#F5F5F7] antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    
    <!-- Fallback for Chunk Load Errors / Stale Cache -->
    <script>
      // Listen for script load errors (e.g., old cached index.html requesting a deleted JS chunk)
      window.addEventListener('error', function(e) {
        const target = e.target || e.srcElement;
        const isScript = target && target.tagName === 'SCRIPT';
        const isLink = target && target.tagName === 'LINK';
        
        if (isScript || isLink) {
          const url = target.src || target.href || '';
          // Only trigger reload for local assets (our own JS/CSS chunks)
          if (url && (url.startsWith(window.location.origin) || url.startsWith('/'))) {
            console.warn('Local asset failed to load. Clearing cache and reloading...', url);
            
            // Prevent infinite reload loops by setting a flag in sessionStorage
            if (!sessionStorage.getItem('asset_reload_attempted')) {
              sessionStorage.setItem('asset_reload_attempted', 'true');
              
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  for(let registration of registrations) {
                    registration.unregister();
                  }
                });
              }
              if (window.caches) {
                caches.keys().then(function(names) {
                  for (let name of names) caches.delete(name);
                });
              }
              
              // Hard reload
              window.location.reload(true);
            } else {
              console.error('Already attempted to reload. Stopping to prevent infinite loop.');
            }
          }
        }
      }, true); // Use capture phase to catch resource errors
    </script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
            }
          });
        });
      }
    </script>
  </body>
</html>
